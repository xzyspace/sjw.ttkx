<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.6, maximum-scale=2.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover">
  <title>🦋 生日快乐 · 单婧雯</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Dancing+Script:wght@400;500;700&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Serif SC', serif;
      background: #0d0a10;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 全局问答遮罩 */
    .global-quiz-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(20, 15, 20, 0.94); backdrop-filter: blur(10px);
      z-index: 9999; display: flex; align-items: center; justify-content: center;
    }
    .global-quiz-box {
      background: rgba(255,248,240,0.9); backdrop-filter: blur(20px);
      border-radius: 28px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      text-align: center; border: 2px solid #f0d8c8; width: 340px; max-width: 90vw;
    }
    .global-quiz-box h2 { font-family: 'Caveat', cursive; font-size: 2.2rem; color: #4a3535; margin-bottom: 20px; }
    .quiz-field { margin-bottom: 14px; text-align: left; }
    .quiz-field label { display: block; font-size: 0.9rem; color: #5c4d4d; margin-bottom: 6px; font-weight: 500; }
    .quiz-field input {
      width: 100%; padding: 12px 16px; border: 1px solid #e0d0c0; border-radius: 14px;
      font-size: 1rem; background: #fffef9; outline: none;
    }
    .quiz-field input:focus { border-color: #c8a080; box-shadow: 0 0 0 3px rgba(200,160,128,0.2); }
    .global-quiz-error { color: #c44; font-size: 0.85rem; min-height: 1.2rem; margin-bottom: 10px; }
    .global-quiz-box button {
      padding: 10px 24px; background: #e8c8b0; border: none; border-radius: 24px;
      font-size: 1rem; font-weight: 500; color: #4a3535; cursor: pointer; transition: 0.3s; margin-top: 4px;
    }
    .global-quiz-box button:hover { background: #d4a880; color: white; }

    .back-btn {
      position: fixed; top: 20px; left: 20px; z-index: 999;
      background: rgba(255,248,240,0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(200,170,140,0.5); border-radius: 24px;
      padding: 8px 18px; font-size: 0.9rem; color: #4a3535;
      cursor: pointer; display: none; text-decoration: none; font-family: inherit;
    }
    .back-btn.show { display: block; }

    .page { width: 100%; display: none; flex-direction: column; align-items: center; }
    .page.active { display: flex; }

    /* 首页统一背景 */
    #homePage {
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }
    .home-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .cake-card {
      background: rgba(255,248,240,0.75); backdrop-filter: blur(12px);
      border-radius: 36px; padding: 40px 30px; box-shadow: 0 20px 60px rgba(80,40,20,0.25);
      text-align: center; max-width: 500px; width: 90%; animation: floatIn 1.5s ease-out;
      margin-bottom: 50px;
    }
    @keyframes floatIn { 0%{ opacity:0; transform:translateY(50px) scale(0.9); } 100%{ opacity:1; transform:translateY(0) scale(1); } }
    .cake-img { width: 200px; height: auto; filter: drop-shadow(0 12px 24px rgba(140,90,60,0.5)); margin-bottom: 10px; }
    .cake-text { font-family: 'Caveat','Dancing Script',cursive; font-size: 2.6rem; color: #543737; letter-spacing: 4px; margin: 8px 0; }
    .cake-sub { font-family: 'Caveat',cursive; font-size: 1.2rem; color: #8b6b5b; }

    .cards-container {
      display: flex; flex-wrap: wrap; gap: 30px; justify-content: center;
      max-width: 900px; width: 100%; margin: 0 auto; padding: 0 20px 40px;
    }
    .portal-card {
      background: rgba(255,250,245,0.75); backdrop-filter: blur(12px); border-radius: 28px;
      padding: 30px 24px; box-shadow: 0 10px 30px rgba(60,30,20,0.2); text-align: center;
      flex: 1 1 220px; max-width: 280px; cursor: pointer; transition: all 0.4s;
      border: 2px solid transparent; color: inherit; text-decoration: none;
    }
    .portal-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(60,30,20,0.3); border-color: #d4b8a0; }
    .portal-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .portal-title { font-family: 'Caveat',cursive; font-size: 1.8rem; color: #4a3535; }

    /* Photography 梦幻背景 */
    .floating-orb {
      position: fixed; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,240,245,0.5), rgba(210,180,240,0.2));
      filter: blur(40px); pointer-events: none; z-index: 0;
      animation: floatBubble 22s infinite alternate ease-in-out;
    }
    @keyframes floatBubble { 0%{ transform: translateY(0px) translateX(0px) scale(1); opacity: 0.4; } 100%{ transform: translateY(-40px) translateX(20px) scale(1.1); opacity: 0.7; } }
    .petal {
      position: fixed; pointer-events: none; font-size: 1.2rem; opacity: 0.25; z-index: 0;
      user-select: none; animation: drift 20s linear infinite;
    }
    @keyframes drift { 0%{ transform: translateY(-10vh) rotate(0deg); opacity: 0.2; } 100%{ transform: translateY(110vh) rotate(360deg); opacity: 0.4; } }

    .photography-page { background: #fefaf5; min-height: 100vh; padding: 70px 20px 80px; position: relative; }
    .photo-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 28px;
      width: 100%; max-width: 1100px; margin: 0 auto 40px; position: relative; z-index: 1;
    }
    .photo-card {
      background: #fffef9; border-radius: 18px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      transition: all 0.3s; position: relative; transform: rotate(var(--rotate,0deg));
      border: 1px solid #f0e0d0; display: flex; flex-direction: column; cursor: pointer;
    }
    .photo-card:nth-child(odd) { --rotate: -2deg; }
    .photo-card:nth-child(even) { --rotate: 1.8deg; }
    .photo-card:nth-child(3n) { --rotate: 2.2deg; }
    .photo-card:nth-child(5n+2) { --rotate: -2.5deg; }
    .photo-card:hover { transform: rotate(0deg) translateY(-5px); box-shadow: 0 16px 36px rgba(0,0,0,0.1); z-index: 2; }
    .photo-card img { width: 100%; height: auto; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }
    .photo-text { padding: 8px 4px; font-size: 0.9rem; color: #6b5b5b; font-style: italic; line-height: 1.5; flex: 1; }
    .photo-date { font-size: 0.7rem; color: #b0a0a0; margin-top: 4px; }
    .delete-photo {
      position: absolute; top: 8px; right: 12px; background: rgba(255,255,255,0.9); border: 1px solid #e0c8b8;
      border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #a88; font-size: 0.9rem; opacity: 0; transition: 0.3s; z-index: 3;
    }
    .photo-card:hover .delete-photo { opacity: 1; }

    .lightbox { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.92); z-index:1000; display:none; align-items:center; justify-content:center; flex-direction:column; }
    .lightbox.active { display:flex; }
    .lightbox-content { position: relative; max-width:90vw; max-height:75vh; display:flex; align-items:center; justify-content:center; margin-bottom:40px; }
    .lightbox-content img { max-width:90vw; max-height:75vh; object-fit:contain; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
    .lightbox-caption { color:#f0e0d0; font-style:italic; text-align:center; padding:0 20px; max-width:600px; margin-top:8px; font-size:1rem; }
    .lightbox-date { color:#b0a0a0; font-size:0.8rem; margin-top:4px; }
    .close-lightbox { position:absolute; top:20px; right:30px; font-size:2.8rem; color:#fff; cursor:pointer; z-index:1001; }
    .nav-arrow { position:absolute; top:50%; transform:translateY(-50%); font-size:3rem; color:rgba(255,255,255,0.8); cursor:pointer; padding:20px; z-index:1001; background:none; border:none; }
    .nav-arrow:hover { color: #fff; }
    .nav-arrow.left { left:10px; }
    .nav-arrow.right { right:10px; }

    .add-section {
      margin: 0 auto; background: #fef8f2; border-radius: 24px; padding: 24px; max-width: 600px;
      width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; z-index: 1;
    }
    .add-title { font-family: 'Caveat', cursive; font-size: 1.8rem; color: #4a3535; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; }
    input, textarea { padding: 12px 16px; border: 1px solid #e0d0c0; border-radius: 14px; font-family: inherit; font-size: 0.9rem; background: #fffdf9; }
    .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .upload-btn { padding: 10px 20px; background: #e8c8b0; border: none; border-radius: 20px; cursor: pointer; font-weight: 500; color: #4a3535; transition: 0.3s; font-size: 0.9rem; }
    .file-name { font-size: 0.8rem; color: #8b6b5b; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .date-locked-hint { font-size: 0.75rem; color: #b0a0a0; margin-top: 2px; display: none; }
    .add-btn { padding: 12px 24px; background: #e8c8b0; border: none; border-radius: 24px; cursor: pointer; font-weight: 500; color: #4a3535; transition: 0.3s; font-family: inherit; font-size: 1rem; }
    .admin-btn { position: fixed; bottom: 16px; left: 16px; z-index: 999; background: rgba(232,200,176,0.5); backdrop-filter: blur(6px); border: 1px solid rgba(180,130,100,0.3); border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; color: #4a3535; cursor: pointer; }

    /* Happy Birthday */
    .hb-page { background: url('背景2.jpg') no-repeat center center fixed; background-size: cover; min-height: 100vh; padding: 70px 20px 80px; position: relative; }
    .hb-page::before { content: ""; position: fixed; inset: 0; background: rgba(255,248,242,0.35); backdrop-filter: blur(4px); z-index: -1; }
    .big-wish { font-family: 'Caveat','Dancing Script',cursive; font-size: 3rem; color: #543737; text-align: center; margin: 20px 0 10px; }
    .weather-card { background: rgba(255,248,240,0.8); backdrop-filter: blur(12px); border-radius: 24px; padding: 20px 30px; margin: 20px auto; box-shadow: 0 8px 28px rgba(100,70,50,0.12); text-align: center; max-width: 400px; }
    .weather-icon { font-size: 3.5rem; }
    .weather-temp { font-size: 2.4rem; color:#8b5e5e; }
    .art-gallery { width: 100%; max-width: 800px; margin: 20px auto; display: flex; flex-direction: column; gap: 24px; }
    .art-row { display: flex; gap: 24px; justify-content: center; }
    .art-card { background: transparent; border: none; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-radius: 18px; transition: all 0.3s; transform: rotate(var(--rotate,0deg)); overflow: hidden; }
    .art-card img { width: 100%; height: auto; display: block; border-radius: 18px; }
    .art-card.card-big { max-width: 450px; margin: 0 auto; }
    .art-card:not(.card-big) { max-width: 280px; flex: 1; }

    .cat { position: fixed; z-index: 100; cursor: pointer; width: 110px; height: 110px; transition: transform 0.3s ease; user-select: none; }
    .cat img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .chat-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(255,250,245,0.95); backdrop-filter: blur(20px); border-radius: 24px; width: 380px; min-width: 260px; min-height: 250px; max-height: 80vh; max-width: 92vw; box-shadow: 0 16px 60px rgba(0,0,0,0.25); z-index: 200; display: none; flex-direction: column; border: 2px solid #f0d8c8; overflow: hidden; }
    .chat-modal.active { display: flex; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: move; user-select: none; font-family: 'Caveat', cursive; font-size: 1.8rem; color: #4a3535; border-bottom: 1px solid #f0e0d5; background: rgba(255,248,240,0.8); border-radius: 24px 24px 0 0; flex-shrink: 0; }
    .chat-header-left { display: flex; align-items: center; gap: 10px; }
    .close-chat, .clear-chat { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #b0a0a0; }
    .chat-messages { flex: 1 1 auto; overflow-y: auto; padding: 14px; }
    .message { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .message.user { flex-direction: row-reverse; }
    .msg-bubble { max-width: 70%; background: #fff1e0; padding: 10px 15px; border-radius: 24px; border-top-left-radius: 8px; word-break: break-word; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.45; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .user .msg-bubble { background: #ffebcd; border-top-right-radius: 8px; border-top-left-radius: 24px; }
    .chat-input-area { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #f0e0d5; background: #fffdf9; border-radius: 0 0 24px 24px; flex-shrink: 0; }
    .chat-input { flex: 1; padding: 8px 12px; border: 1px solid #e0d0c0; border-radius: 16px; font-family: inherit; background: #fffef9; }
    .chat-send { padding: 8px 16px; background: #e8c8b0; border: none; border-radius: 16px; cursor: pointer; color: #4a3535; }

    .password-overlay, .chat-confirm, .change-pwd-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(255,250,245,0.95); backdrop-filter: blur(20px); border-radius: 24px; padding: 28px 24px; box-shadow: 0 16px 50px rgba(0,0,0,0.25); z-index: 220; display: none; flex-direction: column; align-items: center; gap: 14px; border: 2px solid #f0d8c8; text-align: center; width: 300px; max-width: 90vw; }
    .password-overlay.active, .chat-confirm.active, .change-pwd-modal.active { display: flex; }

    /* Research */
    .research-page { background: url('背景3.jpg') no-repeat center center fixed; background-size: cover; min-height: 100vh; padding: 70px 20px 80px; position: relative; }
    .research-page::before { content: ""; position: fixed; inset: 0; background: rgba(255,248,242,0.35); backdrop-filter: blur(4px); z-index: -1; }
    .category { background: rgba(255,250,245,0.75); backdrop-filter: blur(12px); border-radius: 24px; padding: 24px; margin: 0 auto 24px; box-shadow: 0 10px 30px rgba(80,40,20,0.1); width: 100%; max-width: 700px; }
    .cat-title { font-family: 'Caveat', cursive; font-size: 1.8rem; color: #543737; margin-bottom: 12px; }
    .item-list { list-style: none; }
    .item-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0e0d5; font-size: 0.95rem; }
    .item-text { flex: 1; outline: none; padding: 4px 8px; border-radius: 6px; }
    .item-text:focus { background: #fffaf5; border: 1px solid #e0c8b0; }
    .delete-btn { background: none; border: none; cursor: pointer; color: #c88; font-size: 1.2rem; }
    .add-item-form { display: flex; gap: 8px; margin-top: 12px; }
    .add-item-form input { flex: 1; padding: 8px 12px; border: 1px solid #e0d0c0; border-radius: 12px; font-family: inherit; background: #fffdf9; }
    .add-item-form button { padding: 8px 16px; background: #e8c8b0; border: none; border-radius: 14px; cursor: pointer; color: #4a3535; }

    /* 信区域 */
    .letter-section { margin: 40px auto 0; max-width: 600px; width: 100%; }
    .letter-title { font-family: 'Caveat', cursive; font-size: 2rem; color: #543737; margin-bottom: 20px; text-align: center; }
    .letter-images { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .letter-images img {
      max-width: 100%; width: auto; max-height: 400px; border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); object-fit: contain;
      background: rgba(255,255,255,0.6); backdrop-filter: blur(4px);
      cursor: pointer; transition: transform 0.2s;
    }
    .letter-images img:hover { transform: scale(1.02); }

    .letter-lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95); z-index: 1000; display: none;
      align-items: center; justify-content: center; flex-direction: column;
    }
    .letter-lightbox.active { display: flex; }
    .letter-lightbox .close-lightbox { position: absolute; top: 20px; right: 30px; font-size: 2.8rem; color: #fff; cursor: pointer; z-index: 1001; }
    .letter-lightbox .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; color: rgba(255,255,255,0.8); cursor: pointer; padding: 20px; z-index: 1001; background: none; border: none; }
    .letter-lightbox .nav-arrow:hover { color: #fff; }
    .letter-lightbox .nav-arrow.left { left: 10px; }
    .letter-lightbox .nav-arrow.right { right: 10px; }
    .letter-lightbox-content { position: relative; max-width: 90vw; max-height: 80vh; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
    .letter-lightbox-content img { max-width: 90vw; max-height: 80vh; object-fit: contain; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }

    @media (max-width: 768px) {
      .cake-text { font-size: 2rem; }
      .cards-container { flex-direction: column; align-items: center; }
      .photo-grid { grid-template-columns: 1fr; }
      .art-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="global-quiz-overlay" id="globalQuizOverlay">
    <div class="global-quiz-box">
      <h2>🔐 回答两个小问题</h2>
      <div class="quiz-field"><label>1. 你的名字是什么？</label><input type="text" id="quizName" placeholder="例：张三" maxlength="20"></div>
      <div class="quiz-field"><label>2. 你的生日是什么时候？</label><input type="text" id="quizBirthday" placeholder="例：0507" maxlength="10"></div>
      <div class="global-quiz-error" id="globalQuizError"></div>
      <button id="globalQuizSubmit">进入</button>
    </div>
  </div>

  <div id="mainContent" style="display: none; width: 100%;">
    <button class="back-btn" id="backToHomeBtn">← 返回首页</button>

    <!-- 首页：统一背景，移除烟花视频 -->
    <div class="page active" id="homePage">
      <div class="home-content">
        <div class="cake-card">
          <img src="蛋糕.jpg" alt="生日蛋糕" class="cake-img">
          <div class="cake-text">🎂 生日快乐！🎂</div>
          <div class="cake-sub">愿你的每一天都像今天一样被温柔相待</div>
        </div>
        <div class="cards-container">
          <div class="portal-card" data-page="photography"><div class="portal-icon">📷</div><div class="portal-title">Photography</div></div>
          <div class="portal-card" data-page="happyBirthday"><div class="portal-icon">🎈</div><div class="portal-title">Happy Birthday</div></div>
          <div class="portal-card" data-page="research"><div class="portal-icon">🔭</div><div class="portal-title">Research</div></div>
        </div>
      </div>
    </div>

    <!-- Photography -->
    <div class="page photography-page" id="photographyPage">
      <div class="floating-orb" style="width: 280px; height: 280px; top: -60px; left: -80px; background: radial-gradient(circle, #ffdbef, #efcbff);"></div>
      <div class="floating-orb" style="width: 380px; height: 380px; bottom: -120px; right: -70px; background: radial-gradient(circle, #f7d5f0, #cfb5ff); animation-duration: 28s;"></div>
      <div class="floating-orb" style="width: 200px; height: 200px; top: 40%; left: 70%; background: radial-gradient(circle, #ffe0f0, #f5cce6); animation-duration: 18s;"></div>
      <div class="petal" style="left: 5%; animation-duration: 24s; animation-delay: 0s;">🌸</div>
      <div class="petal" style="left: 15%; animation-duration: 32s; animation-delay: 2s;">🌼</div>
      <div class="petal" style="left: 85%; animation-duration: 28s; animation-delay: 1s;">🌙</div>
      <div class="petal" style="left: 92%; animation-duration: 21s; animation-delay: 4s;">✨</div>
      <div class="petal" style="left: 45%; animation-duration: 35s; animation-delay: 0.5s;">🍃</div>
      <h1 style="font-family:'Caveat',cursive; text-align:center; color:#4a3535; margin-bottom:30px; position:relative; z-index:1;">📷 Photography</h1>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="add-section">
        <div class="add-title">＋ 添加新照片</div>
        <div class="form-group">
          <input type="text" id="imgUrl" placeholder="照片链接 (URL)">
          <div class="upload-row"><span style="color:#8b6b5b; font-size:0.9rem;">或</span><button class="upload-btn" id="uploadFromAlbum">📷 从相册上传</button><span class="file-name" id="fileNameDisplay"></span></div>
          <input type="file" id="fileInput" accept="image/*" style="display:none;">
          <textarea id="caption" rows="3" placeholder="照片附文……"></textarea>
          <input type="date" id="photoDate">
          <div class="date-locked-hint" id="dateLockedHint"></div>
          <button class="add-btn" id="addPhotoBtn">保存照片</button>
        </div>
      </div>
      <div class="admin-btn" id="adminBtn">⚙️ 管理</div>
    </div>

    <!-- 照片全屏预览 -->

    (function() {
      const pages = { home: document.getElementById('homePage'), photography: document.getElementById('photographyPage'), happyBirthday: document.getElementById('hbPage'), research: document.getElementById('researchPage') };
      const backBtn = document.getElementById('backToHomeBtn');
      function showPage(id) {
        Object.values(pages).forEach(p => p.classList.remove('active'));
        pages[id].classList.add('active');
        backBtn.classList.toggle('show', id !== 'home');
        if (id === 'happyBirthday') startCat(); else stopCat();
      }
      backBtn.addEventListener('click', () => showPage('home'));
      document.querySelectorAll('.portal-card').forEach(c => c.addEventListener('click', () => showPage(c.dataset.page)));

      // Photography
      const DB_NAME='SJW_Photography', STORE='photos'; let db;
      function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains(STORE)) e.target.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true}); }; r.onsuccess=e=>{ db=e.target.result; res(db); }; r.onerror=e=>rej(e.target.error); }); }
      async function loadPhotos(){ if(!db) await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>res(req.result); req.onerror=e=>rej(e.target.error); }); }
      async function savePhoto(p){ if(!db) await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); const req=tx.objectStore(STORE).add(p); req.onsuccess=()=>res(req.result); req.onerror=e=>rej(e.target.error); }); }
      async function delPhoto(id){ if(!db) await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(id); req.onsuccess=()=>res(); req.onerror=e=>rej(e.target.error); }); }
      async function clearAllPhotos(){ if(!db) await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).clear(); req.onsuccess=()=>res(); req.onerror=e=>rej(e.target.error); }); }
      const defPhotos=[{url:'https://picsum.photos/seed/sjw4/600/400',caption:'山间的风，带着松树的清香。',date:'2026-05-10'}];
      let pendingBase64=null;
      function randomH(){ return Math.floor(Math.random()*61)+160; }
      function isBeforeCutoff(){ const t=new Date(), c=new Date('2026-06-05'); return t<c; }

        const di=document.getElementById('photoDate'), dh=document.getElementById('dateLockedHint'), ts=new Date().toISOString().split('T')[0];

        else{ di.value=ts; di.setAttribute('readonly',true); dh.style.display='block'; }
      }
      async function renderPhotos(){
        const grid=document.getElementById('photoGrid'); let photos=await loadPhotos();
        if(!photos.length){ for(const p of defPhotos) await savePhoto(p); photos=await loadPhotos(); }
        grid.innerHTML=photos.map(p=>`<div class="photo-card" data-id="${p.id}"><img src="${p.url}" style="height:${randomH()}px;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect fill=%22%23f5e8dc%22/><text x=%22150%22 y=%22100%22 fill=%22%23c8b0a0%22>🖼️</text></svg>'"><div class="photo-text"><div class="photo-caption">${p.caption||''}</div><div class="photo-date">${p.date||''}</div></div><button class="delete-photo" data-id="${p.id}">✕</button></div>`).join('');
        document.querySelectorAll('.photo-card').forEach(c=>c.addEventListener('click',e=>{ if(!e.target.classList.contains('delete-photo')) openLightbox(parseInt(c.dataset.id)); }));
        document.querySelectorAll('.delete-photo').forEach(b=>b.addEventListener('click',async e=>{ e.stopPropagation(); await delPhoto(parseInt(b.dataset.id)); renderPhotos(); }));
      }
      const lb=document.getElementById('lightbox'), lbImg=document.getElementById('lightboxImg'), lbCap=document.getElementById('lightboxCaption'), lbDate=document.getElementById('lightboxDate'), prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
      let curPhotos=[], curId=null;
      async function openLightbox(id){ curPhotos=await loadPhotos(); const i=curPhotos.findIndex(p=>p.id===id); if(i===-1) return; curId=id; showPhoto(i); lb.classList.add('active'); }
      function showPhoto(i){ const p=curPhotos[i]; curId=p.id; lbImg.src=p.url; lbCap.textContent=p.caption||''; lbDate.textContent=p.date||''; prevBtn.style.display=i>0?'block':'none'; nextBtn.style.display=i<curPhotos.length-1?'block':'none'; }
      document.getElementById('closeLightbox').addEventListener('click',()=>lb.classList.remove('active'));
      lb.addEventListener('click',e=>{ if(e.target===lb) lb.classList.remove('active'); });
      prevBtn.addEventListener('click',()=>navigate(-1)); nextBtn.addEventListener('click',()=>navigate(1));
      function navigate(d){ const i=curPhotos.findIndex(p=>p.id===curId); if(i===-1) return; const ni=i+d; if(ni>=0&&ni<curPhotos.length) showPhoto(ni); }
      document.addEventListener('keydown',e=>{ if(!lb.classList.contains('active')) return; if(e.key==='ArrowLeft') navigate(-1); else if(e.key==='ArrowRight') navigate(1); else if(e.key==='Escape') lb.classList.remove('active'); });
      function compressImg(file){ return new Promise((res,rej)=>{ const reader=new FileReader(); reader.onload=e=>{ const img=new Image(); img.onload=()=>{ let w=img.width, h=img.height; if(w>800||h>800){ if(w>h){ h*=800/w; w=800; } else { w*=800/h; h=800; } } const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h); res(canvas.toDataURL('image/jpeg',0.7)); }; img.onerror=rej; img.src=e.target.result; }; reader.onerror=rej; reader.readAsDataURL(file); }); }
      async function addPhoto(url,caption,date){ await savePhoto({url,caption,date}); renderPhotos(); document.getElementById('imgUrl').value=''; document.getElementById('caption').value=''; document.getElementById('fileNameDisplay').textContent=''; pendingBase64=null; updateDate(); }
      document.getElementById('addPhotoBtn').addEventListener('click',async()=>{
        const url=document.getElementById('imgUrl').value.trim(), cap=document.getElementById('caption').value.trim(), dt=isBeforeCutoff()?document.getElementById('photoDate').value:new Date().toISOString().split('T')[0];
        if(pendingBase64) await addPhoto(pendingBase64,cap,dt); else if(url) await addPhoto(url,cap,dt); else alert('请填写照片链接或从相册上传');
      });
      document.getElementById('uploadFromAlbum').addEventListener('click',()=>document.getElementById('fileInput').click());
      document.getElementById('fileInput').addEventListener('change',async e=>{
        const file=e.target.files[0]; if(!file) return; document.getElementById('fileNameDisplay').textContent='正在压缩...';
        try{ pendingBase64=await compressImg(file); document.getElementById('fileNameDisplay').textContent=file.name+' (已压缩)'; document.getElementById('imgUrl').placeholder='已从相册选择：'+file.name; }catch{ alert('图片处理失败'); } e.target.value='';
      });
      document.getElementById('adminBtn').addEventListener('click',()=>{
        const act=prompt('管理面板：\nreset - 重置默认照片\nclear - 清空所有照片\nexport - 导出备份\nimport - 导入备份（追加）');
        if(act==='reset'){ (async()=>{ await clearAllPhotos(); for(const p of defPhotos) await savePhoto(p); renderPhotos(); })(); }
        else if(act==='clear'){ if(confirm('确定清空所有照片？')){ (async()=>{ await clearAllPhotos(); renderPhotos(); })(); } }
        else if(act==='export'){ (async()=>{ const data=JSON.stringify(await loadPhotos(),null,2); const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='photos_backup.json'; a.click(); })(); }
        else if(act==='import'){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=e=>{ const fr=new FileReader(); fr.onload=async ev=>{ try{ const imp=JSON.parse(ev.target.result); if(Array.isArray(imp)){ for(const p of imp) await savePhoto(p); renderPhotos(); alert('导入成功！照片已追加。'); } else alert('文件格式不正确'); }catch{ alert('解析失败'); } }; fr.readAsText(e.target.files[0]); }; inp.click(); }
      });
      openDB().then(()=>renderPhotos()); updateDate();

      // 信的全屏浏览
      const letterLightbox = document.getElementById('letterLightbox');
      const letterImg = document.getElementById('letterLightboxImg');
      const closeLetter = document.getElementById('closeLetterLightbox');
      const letterPrev = document.getElementById('letterPrevBtn');
      const letterNext = document.getElementById('letterNextBtn');
      let letterPages = [], currentLetterIndex = 0;
      function initLetterViewer() {
        const allImgs = document.querySelectorAll('#letterImages .letter-page');
        letterPages = Array.from(allImgs).filter(img => img.style.display !== 'none');
        letterPages.forEach((img, index) => {
          img.addEventListener('click', () => { currentLetterIndex = index; showLetterPage(currentLetterIndex); letterLightbox.classList.add('active'); });
        });
      }
      function showLetterPage(index) {
        if (index < 0 || index >= letterPages.length) return;
        currentLetterIndex = index;
        letterImg.src = letterPages[currentLetterIndex].src;
        letterPrev.style.display = currentLetterIndex > 0 ? 'block' : 'none';
        letterNext.style.display = currentLetterIndex < letterPages.length - 1 ? 'block' : 'none';
      }
      function navigateLetter(direction) { showLetterPage(currentLetterIndex + direction); }
      closeLetter.addEventListener('click', () => letterLightbox.classList.remove('active'));
      letterLightbox.addEventListener('click', (e) => { if (e.target === letterLightbox) letterLightbox.classList.remove('active'); });
      letterPrev.addEventListener('click', () => navigateLetter(-1));
      letterNext.addEventListener('click', () => navigateLetter(1));
      document.addEventListener('keydown', (e) => {
        if (!letterLightbox.classList.contains('active')) return;
        if (e.key === 'ArrowLeft') navigateLetter(-1);
        else if (e.key === 'ArrowRight') navigateLetter(1);
        else if (e.key === 'Escape') letterLightbox.classList.remove('active');
      });
      let touchStartX = 0;
      letterLightbox.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
      letterLightbox.addEventListener('touchend', (e) => {
        if (!letterLightbox.classList.contains('active')) return;
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 50) { if (diff > 0) navigateLetter(1); else navigateLetter(-1); }
      });
      initLetterViewer();

      // Happy Birthday 猫咪老师
      const AI_URL='https://api.deepseek.com/v1/chat/completions', AI_KEY='sk-4c64c34cc08349e19f4ffe100a7f9987', AI_MODEL='deepseek-chat';
      const HIST_KEY='sjw_chat_hist', PWD_KEY='sjw_chat_pwd', INIT_PWD='0610';
      function loadHist(){ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }
      function saveHist(h){ localStorage.setItem(HIST_KEY,JSON.stringify(h)); }
      function clearHist(){ localStorage.removeItem(HIST_KEY); }
      function getPwd(){ return localStorage.getItem(PWD_KEY)||INIT_PWD; }
      function setPwd(p){ localStorage.setItem(PWD_KEY,p); }
      let conversationHistory = loadHist();
      let catAnimFrame, catRunning=false;
      const cat=document.getElementById('cat'); if(cat){ cat.style.left='0px'; cat.style.top='0px'; }
      let catX=0,catY=0,targetX=0,targetY=0,isPlaying=false;
      function edgeTarget(){ const w=window.innerWidth-110, h=window.innerHeight-150; const e=Math.floor(Math.random()*4); if(e===0) return {x:Math.random()*w, y:40+Math.random()*60}; if(e===1) return {x:Math.random()*w, y:h-60-Math.random()*60}; if(e===2) return {x:40+Math.random()*60, y:Math.random()*h}; return {x:w-60-Math.random()*60, y:Math.random()*h}; }
      function newTarget(){ const t=edgeTarget(); targetX=Math.max(40,Math.min(window.innerWidth-150,t.x)); targetY=Math.max(40,Math.min(window.innerHeight-180,t.y)); }
      function catMove(){
        if(!catRunning||!cat) return;
        if(!isPlaying){ const dx=targetX-catX, dy=targetY-catY, dist=Math.hypot(dx,dy); if(dist>3){ catX+=(dx/dist)*0.8; catY+=(dy/dist)*0.8; cat.style.transform=`rotate(${Math.atan2(dx,-dy)*180/Math.PI}deg)`; } else { newTarget(); if(Math.random()<0.2){ isPlaying=true; cat.style.transform='rotate(0deg)'; setTimeout(()=>{ isPlaying=false; },2000); } } }
        cat.style.left=catX+'px'; cat.style.top=catY+'px'; catAnimFrame=requestAnimationFrame(catMove);
      }
      window.startCat = function(){ if(catRunning) return; catRunning=true; catX=100; catY=100; newTarget(); catMove(); };

      const pwOverlay=document.getElementById('passwordOverlay'), pwInput=document.getElementById('passwordInput'), pwError=document.getElementById('passwordError');

      function showPw(mode){ pendingMode=mode; pwInput.value=''; pwError.textContent=''; pwOverlay.classList.add('active'); pwInput.focus(); }

      submitPw.addEventListener('click',()=>{ if(checkPw(pwInput.value.trim())) onPwSuccess(); else pwError.textContent='密码不正确，请再试一次喵～'; });

        const old=document.getElementById('oldPwd').value.trim(), nw=document.getElementById('newPwd').value.trim(), cf=document.getElementById('confirmPwd').value.trim();
        if(!old||!nw||!cf) return document.getElementById('changePwdError').textContent='所有字段都需要填写喵～';

      async function aiReply(userMsg){

        const sys = {
          role: 'system',
          content: `你是一只名叫猫咪老师的小猫，拥有ENFJ人格。你非常温暖、富有同情心，善于察觉他人情绪，并且具备解决实际问题的智慧。${context}当对方倾诉时，先共情，再提供一两个实质建议。永远不说教，不用括号动作。回复简短可爱。你需要先共情对方的情绪让对方感觉到被理解，同时也要积极地认可对方，在处理好情绪后，接着根据对方的具体问题，用商量、轻柔的语气提供实质性、可操作的小建议。`
        };
        const msgs = [sys, ...conversationHistory, {role:'user', content:userMsg}];
        try {
          const res = await fetch(AI_URL, { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${AI_KEY}`}, body:JSON.stringify({model:AI_MODEL, messages:msgs, temperature:1.0, max_tokens:350}) });
          const data = await res.json();
          if (data.choices && data.choices[0]) return data.choices[0].message.content.replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').trim();
        } catch(e) {}
        return null;
      }
      function localReply(text){
        const x = text.toLowerCase();
        if (x.includes('论文')||x.includes('进度')) return '喵… 论文卡住的感觉我懂。或许可以试试把大纲拆成几个小块，今天只专注其中一段？';
        if (x.includes('迷茫')||x.includes('不知道')) return '迷茫的时候，先停下来问问自己此刻最在意什么，答案往往就在第一个念头里。';
        if (x.includes('压力')||x.includes('累')) return '压力大的时候，身体也会紧。先深呼吸几次，然后把烦心事列个小清单，挑最烦的那个聊聊看？';
        if (x.includes('难过')||x.includes('伤心')) return '感觉到你好像有点低落… 愿意和我说说发生了什么吗？说出来会好一点。';
        if (x.includes('开心')||x.includes('快乐')) return '好心情是会传染的喵～ 是什么让你这么开心呀？';
        return '喵～ 我在听呢。不管什么事，我都会陪着你的。';
      }
      async function sendMessage(){ const text=chatInput.value.trim(); if(!text) return; addMsg(text,'user'); chatInput.value=''; const thinking=addMsg('猫咪老师正在思考...','cat'); let reply=await aiReply(text) || localReply(text); thinking.remove(); conversationHistory.push({role:'user',content:text},{role:'assistant',content:reply}); saveHist(conversationHistory); addMsg(reply,'cat'); }
      sendBtn.addEventListener('click',sendMessage); chatInput.addEventListener('keypress',e=>{ if(e.key==='Enter') sendMessage(); });

      function openChat(){ if(msgBox.children.length===0 && conversationHistory.length>0) renderAll(); else if(msgBox.children.length===0 && conversationHistory.length===0){ const greeting='喵～ 你好呀！我是猫咪老师，今天想好好听你说话。你怎么样？'; conversationHistory.push({role:'assistant',content:greeting}); saveHist(conversationHistory); addMsg(greeting,'cat'); } chatModal.classList.add('active'); chatInput.focus(); }
      closeChatBtn.addEventListener('click',()=>{ chatModal.classList.remove('active'); });
      clearBtn.addEventListener('click',()=>{ if(confirm('确定清空所有聊天记录吗？')){ conversationHistory=[]; clearHist(); msgBox.innerHTML=''; const greeting='喵～ 你好呀！我是猫咪老师，今天想好好听你说话。你怎么样？'; conversationHistory.push({role:'assistant',content:greeting}); saveHist(conversationHistory); addMsg(greeting,'cat'); } });
      const chatHeader=document.getElementById('chatHeader'); let dragging=false, offX, offY;
      chatHeader.addEventListener('mousedown',e=>{ if(e.target.classList.contains('close-chat')||e.target.classList.contains('clear-chat')) return; dragging=true; const r=chatModal.getBoundingClientRect(); offX=e.clientX-r.left; offY=e.clientY-r.top; });
      window.addEventListener('mousemove',e=>{ if(dragging){ chatModal.style.left=(e.clientX-offX)+'px'; chatModal.style.top=(e.clientY-offY)+'px'; chatModal.style.transform='none'; } });
      window.addEventListener('mouseup',()=>{ dragging=false; });

      // Research
      const RKEY='sjw_research', defRData={ travel:{title:'🗺️ 未来旅行计划',items:['还未确定的目的地','想去海边看一次日出','一起爬山']}, movies:{title:'🎬 电影之夜',items:['值得反复观看的电影','《星际穿越》','《怦然心动》']}, music:{title:'🎵 音乐推荐',items:['那些触动心灵的旋律','Coldplay - Yellow','周杰伦 - 晴天']}, ideas:{title:'💡 灵感碎片',items:['随时记录的小想法','开一家书店','学会弹吉他']} };
      function loadR(){ return JSON.parse(localStorage.getItem(RKEY)||JSON.stringify(defRData)); }
      function saveR(d){ localStorage.setItem(RKEY,JSON.stringify(d)); }
      function renderR(){
        const cont=document.getElementById('categoriesContainer'); const data=loadR();
        cont.innerHTML=Object.entries(data).map(([k,v])=>`<div class="category" data-cat="${k}"><div class="cat-title">${v.title}</div><ul class="item-list">${v.items.map((it,i)=>`<li><span class="item-text" contenteditable="true" data-idx="${i}">${it}</span><button class="delete-btn" data-idx="${i}">✕</button></li>`).join('')}</ul><div class="add-item-form"><input type="text" placeholder="添加新条目..." class="new-item-input"><button class="add-item-btn">添加</button></div></div>`).join('');
        document.querySelectorAll('.category').forEach(catDiv=>{
          const catKey=catDiv.dataset.cat;
          catDiv.querySelectorAll('.item-text').forEach(span=>span.addEventListener('blur',()=>{ const d=loadR(); d[catKey].items[span.dataset.idx]=span.textContent; saveR(d); }));
          catDiv.querySelectorAll('.delete-btn').forEach(btn=>btn.addEventListener('click',()=>{ const d=loadR(); d[catKey].items.splice(btn.dataset.idx,1); saveR(d); renderR(); }));
          const inp=catDiv.querySelector('.new-item-input'), addBtn=catDiv.querySelector('.add-item-btn');
          addBtn.addEventListener('click',()=>{ if(inp.value.trim()){ const d=loadR(); d[catKey].items.push(inp.value.trim()); saveR(d); renderR(); } });
          inp.addEventListener('keypress',e=>{ if(e.key==='Enter'){ if(inp.value.trim()){ const d=loadR(); d[catKey].items.push(inp.value.trim()); saveR(d); renderR(); } } });
        });
      }
      renderR();
    })();
  </script>
</body>
</html>
